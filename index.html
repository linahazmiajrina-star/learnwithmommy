<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn with Mommy · 华文一年级</title>
<meta name="description" content="Flashcards and quizzes for SRJKC Bahasa Cina Year 1 (一年级华文), with pinyin, English and sound.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@500;700&family=ZCOOL+KuaiLe&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>学华文</h1>
      <span>Learn with Mommy · Year 1 一年级</span>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-cards" role="tab" aria-selected="true"><span class="zh">闪卡</span>Cards</button>
      <button id="tab-quiz" role="tab" aria-selected="false"><span class="zh">测验</span>Quiz</button>
    </nav>
  </header>

  <section class="picker" aria-label="Chapters">
    <div class="picker-head">
      <span class="label">Chapters 单元</span>
      <div>
        <button class="linkish" id="pick-all">All</button>
        <button class="linkish" id="pick-none">Clear</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="picked" id="picked"></div>
  </section>

  <main id="view-cards"></main>
  <main id="view-quiz" hidden></main>

  <footer>
    Words, pinyin and sentences from the free
    <a href="https://multilingual-malaysian.github.io/SRJKC_resources/year1/#pinyin" target="_blank" rel="noopener">SRJKC Resources Year 1 pinyin edition</a>.
    For home learning only.
  </footer>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
